[project]
name = "arena-ocr-service"
version = "0.1.0"
description = "Local ROI OCR service for Arena Trading Agent"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.116,<1",
    "numpy>=2.0,<3",
    "onnxruntime>=1.22,<2",
    "pillow>=11,<13",
    "rapidocr>=3.9,<4",
    "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
